[project]
name = "pathfinder-linehook"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.128,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2", "uvicorn>=0.40,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]

