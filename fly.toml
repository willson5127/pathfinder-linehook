# 複製為 fly.toml，app 請填你在 Fly.io 實際擁有的 App 名稱。
app = "pathfinder-linehook"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  CHAT_DB_PATH = "/data/chats.sqlite3"

[[mounts]]
  source = "linehook_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
